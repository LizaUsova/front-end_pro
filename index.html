<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>front-end pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>

<div class="container-fluid row">
    <div class="col-4 d-flex flex-column justify-content-start">
        <nav class="navbar">
            <form data-form class="container-fluid flex-column align-items-start gap-1">
                <button data-btn-books class="btn btn-primary w-100 mb-2" type="button">Books</button>
                <button data-btn-movies class="btn btn-success w-100 mb-2" type="button">Movies</button>
            </form>
        </nav>
    </div>
    <div class="col-4 d-flex flex-column justify-content-start" >
        <nav class="navbar visually-hidden" data-books-list>
            <form data-form-books class="container-fluid flex-column align-items-start gap-1">
                <button data-book-adventure class="btn btn-primary w-100 mb-2" type="button">Adventure</button>
                <button data-book-thriller class="btn btn-primary w-100 mb-2" type="button">Thriller</button>
                <button data-book-fantasy class="btn btn-primary w-100 mb-2" type="button">Fantasy</button>
            </form>
        </nav>
        <nav class="navbar visually-hidden" data-movies-list>
            <form data-form-movies class="container-fluid flex-column align-items-start gap-1">
                <button data-movie-comedy class="btn btn-success w-100 mb-2" type="button">Comedy</button>
                <button data-movie-action class="btn btn-success w-100 mb-2" type="button">Action</button>
                <button data-movie-horror class="btn btn-success w-100 mb-2" type="button">Horror</button>
            </form>
        </nav>
    </div>
    <div class="col-4 mt-2">
        <div data-card class="card visually-hidden">
            <div class="card-body">
                <h4 data-card-name class="card-title"></h4>
                <p data-description class="card-text"></p>
                <a data-buy href="#" class="btn btn-dark d-flex flex-column justify-content-start">Buy</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
<script src="./js/script.js"></script>
</body>
</html>
